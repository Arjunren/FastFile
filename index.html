<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FastFile - File Sharing</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .loader {
            border-top-color: #2563eb;
            animation: spinner 1s linear infinite;
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">

                <div class="flex items-center">
                    <span class="text-xl font-bold text-blue-600">
                        FastFile
                    </span>
                </div>

                <div class="flex space-x-4 items-center">
                    <button
                        id="tab-upload-btn"
                        class="text-blue-600 border-b-2 border-blue-600 px-3 py-2 text-sm font-medium">
                        Upload
                    </button>

                    <button
                        id="tab-download-btn"
                        class="text-gray-500 hover:text-gray-700 px-3 py-2 text-sm font-medium">
                        Download
                    </button>
                </div>

            </div>
        </div>
    </nav>


    <!-- MAIN -->
    <main class="flex-grow flex items-center justify-center p-4">

        <div class="w-full max-w-lg bg-white rounded-xl shadow-md border border-gray-100 p-6 md:p-8">


            <!-- ========================= -->
            <!-- UPLOAD VIEW -->
            <!-- ========================= -->

            <div id="upload-view">

                <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
                    Upload Files
                </h2>


                <!-- DROP ZONE -->

                <div
                    id="drop-zone"
                    class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors cursor-pointer bg-gray-50">

                    <input
                        type="file"
                        id="file-input"
                        multiple
                        class="hidden">

                    <svg
                        class="mx-auto h-12 w-12 text-gray-400 mb-3"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />

                    </svg>

                    <p class="text-gray-600 mb-1">
                        Click to browse or drag & drop
                    </p>

                    <p
                        class="text-xs text-gray-400"
                        id="file-count-display">

                        Multiple files supported. 24h expiration.

                    </p>

                </div>


                <!-- UPLOAD BUTTON -->

                <button
                    id="upload-btn"
                    class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors hidden">

                    Start Cloud Upload

                </button>


                <!-- LOADING -->

                <div
                    id="upload-loading"
                    class="hidden mt-6 flex flex-col items-center">

                    <div
                        class="loader rounded-full border-4 border-gray-200 h-10 w-10 mb-3">
                    </div>

                    <p
                        id="upload-progress-text"
                        class="text-sm text-gray-600 font-medium">

                        Uploading to Firebase...

                    </p>

                </div>


                <!-- SUCCESS -->

                <div
                    id="upload-success"
                    class="hidden mt-6 bg-green-50 border border-green-200 rounded-lg p-5">

                    <h3 class="text-green-800 font-bold mb-2 flex items-center">

                        <svg
                            class="w-5 h-5 mr-2"
                            fill="currentColor"
                            viewBox="0 0 20 20">

                            <path
                                fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                clip-rule="evenodd">
                            </path>

                        </svg>

                        Upload Successful!

                    </h3>


                    <p class="text-xs text-gray-600 mb-4">
                        Files will automatically expire 24 hours after upload.
                    </p>


                    <div
                        class="bg-white p-3 rounded border border-gray-200 flex justify-between items-center mb-3">

                        <span
                            id="secret-key-display"
                            class="font-mono text-lg font-bold text-gray-800 tracking-wider">

                            XXXXXX

                        </span>

                        <button
                            id="copy-key-btn"
                            class="text-blue-600 hover:text-blue-800 text-sm font-semibold">

                            Copy Secret Key

                        </button>

                    </div>


                    <p
                        id="upload-time-display"
                        class="text-xs text-gray-500 mb-4">
                    </p>


                    <button
                        id="reset-upload-btn"
                        class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded">

                        Upload Another File

                    </button>

                </div>

            </div>


            <!-- ========================= -->
            <!-- DOWNLOAD VIEW -->
            <!-- ========================= -->

            <div id="download-view" class="hidden">

                <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
                    Download Files
                </h2>


                <div class="mb-6">

                    <label
                        class="block text-sm font-medium text-gray-700 mb-2">

                        Enter Secret Key

                    </label>


                    <div class="flex">

                        <input
                            type="text"
                            id="search-key"
                            placeholder="e.g. A1B2C3"
                            maxlength="6"
                            autocomplete="off"
                            class="uppercase font-mono flex-grow border border-gray-300 rounded-l-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">


                        <button
                            id="search-btn"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 rounded-r-lg">

                            Search

                        </button>

                    </div>


                    <p
                        id="search-error"
                        class="text-red-500 text-sm mt-2 hidden">
                    </p>

                </div>


                <div id="download-results" class="hidden">

                    <h3 class="font-bold text-gray-800 mb-3 border-b pb-2">
                        Available Files
                    </h3>

                    <ul
                        id="file-list"
                        class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-2">
                    </ul>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-white border-t border-gray-200 mt-auto py-6">

        <div
            class="max-w-4xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between">

            <p class="text-sm text-gray-500">
                Open Source File Sharing System
            </p>

            <p class="text-sm text-gray-500 mt-2 md:mt-0 font-medium">

                Created by
                <span class="text-gray-800 font-bold">
                    Arjunren Von
                </span>

            </p>

        </div>

    </footer>


    <!-- ====================================================== -->
    <!-- FIREBASE -->
    <!-- ====================================================== -->

    <script type="module">

        /*
        ==========================================================
        FIREBASE IMPORTS
        ==========================================================
        */

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getStorage,
            ref,
            uploadBytesResumable,
            getDownloadURL
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";


        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            Timestamp
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


        /*
        ==========================================================
        FIREBASE CONFIGURATION
        ==========================================================
        */

        const firebaseConfig = {

            apiKey: "AIzaSyDVZA1JYwYEHGt5L1fJbHGuizKtAoAZP6A",

            authDomain: "fastfile-2ceff.firebaseapp.com",

            projectId: "fastfile-2ceff",

            storageBucket: "fastfile-2ceff.firebasestorage.app",

            messagingSenderId: "75987316204",

            appId: "1:75987316204:web:6b25fbf8c55ca2ac79e4c9"

        };


        /*
        ==========================================================
        INITIALIZE FIREBASE
        ==========================================================
        */

        const app = initializeApp(firebaseConfig);

        const storage = getStorage(app);

        const db = getFirestore(app);


        /*
        ==========================================================
        APPLICATION STATE
        ==========================================================
        */

        let selectedFiles = [];

        const HOURS_24_MS = 24 * 60 * 60 * 1000;


        /*
        ==========================================================
        DOM ELEMENTS
        ==========================================================
        */

        const dropZone =
            document.getElementById("drop-zone");

        const fileInput =
            document.getElementById("file-input");

        const uploadBtn =
            document.getElementById("upload-btn");

        const uploadView =
            document.getElementById("upload-view");

        const downloadView =
            document.getElementById("download-view");

        const uploadLoading =
            document.getElementById("upload-loading");

        const uploadProgressText =
            document.getElementById("upload-progress-text");

        const uploadSuccess =
            document.getElementById("upload-success");

        const secretKeyDisplay =
            document.getElementById("secret-key-display");

        const uploadTimeDisplay =
            document.getElementById("upload-time-display");

        const searchKey =
            document.getElementById("search-key");

        const searchError =
            document.getElementById("search-error");

        const downloadResults =
            document.getElementById("download-results");

        const fileList =
            document.getElementById("file-list");


        /*
        ==========================================================
        TAB NAVIGATION
        ==========================================================
        */

        document
            .getElementById("tab-upload-btn")
            .addEventListener("click", () => {

                switchTab("upload");

            });


        document
            .getElementById("tab-download-btn")
            .addEventListener("click", () => {

                switchTab("download");

            });


        function switchTab(tab) {

            const uploadTab =
                document.getElementById("tab-upload-btn");

            const downloadTab =
                document.getElementById("tab-download-btn");


            if (tab === "upload") {

                uploadView.classList.remove("hidden");

                downloadView.classList.add("hidden");


                uploadTab.className =
                    "text-blue-600 border-b-2 border-blue-600 px-3 py-2 text-sm font-medium";


                downloadTab.className =
                    "text-gray-500 hover:text-gray-700 px-3 py-2 text-sm font-medium";

            } else {

                uploadView.classList.add("hidden");

                downloadView.classList.remove("hidden");


                uploadTab.className =
                    "text-gray-500 hover:text-gray-700 px-3 py-2 text-sm font-medium";


                downloadTab.className =
                    "text-blue-600 border-b-2 border-blue-600 px-3 py-2 text-sm font-medium";

            }

        }


        /*
        ==========================================================
        FILE SELECTION
        ==========================================================
        */

        dropZone.addEventListener("click", () => {

            fileInput.click();

        });


        fileInput.addEventListener("change", (event) => {

            handleFiles(event.target.files);

        });


        dropZone.addEventListener("dragover", (event) => {

            event.preventDefault();

            dropZone.classList.add("bg-blue-50");

        });


        dropZone.addEventListener("dragleave", () => {

            dropZone.classList.remove("bg-blue-50");

        });


        dropZone.addEventListener("drop", (event) => {

            event.preventDefault();

            dropZone.classList.remove("bg-blue-50");

            handleFiles(event.dataTransfer.files);

        });


        function handleFiles(files) {

            if (!files || files.length === 0) {

                return;

            }


            selectedFiles =
                Array.from(files);


            document
                .getElementById("file-count-display")
                .innerText =
                `${selectedFiles.length} file(s) selected`;


            uploadBtn.classList.remove("hidden");

        }


        /*
        ==========================================================
        GENERATE SECRET KEY
        ==========================================================
        */

        function generateSecretKey() {

            const characters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


            let key = "";


            for (let i = 0; i < 6; i++) {

                const randomIndex =
                    Math.floor(
                        Math.random() * characters.length
                    );


                key +=
                    characters[randomIndex];

            }


            return key;

        }


        /*
        ==========================================================
        UPLOAD FILES
        ==========================================================
        */

        uploadBtn.addEventListener("click", async () => {

            if (selectedFiles.length === 0) {

                return;

            }


            uploadBtn.classList.add("hidden");

            dropZone.classList.add("hidden");

            uploadLoading.classList.remove("hidden");


            const secretKey =
                generateSecretKey();


            const now =
                Date.now();


            const expiresAt =
                now + HOURS_24_MS;


            const uploadedFilesData = [];


            try {

                /*
                ----------------------------------------------
                UPLOAD EACH FILE
                ----------------------------------------------
                */

                for (
                    let i = 0;
                    i < selectedFiles.length;
                    i++
                ) {

                    const file =
                        selectedFiles[i];


                    uploadProgressText.innerText =
                        `Uploading file ${i + 1} of ${selectedFiles.length}...`;


                    /*
                    Create Firebase Storage path
                    */

                    const storagePath =
                        `uploads/${secretKey}/${file.name}`;


                    const storageRef =
                        ref(storage, storagePath);


                    /*
                    Upload file
                    */

                    const uploadTask =
                        uploadBytesResumable(
                            storageRef,
                            file
                        );


                    /*
                    Wait for upload to finish
                    */

                    await new Promise(
                        (resolve, reject) => {

                            uploadTask.on(
                                "state_changed",

                                (snapshot) => {

                                    const progress =
                                        (
                                            snapshot.bytesTransferred /
                                            snapshot.totalBytes
                                        ) * 100;


                                    uploadProgressText.innerText =
                                        `Uploading ${i + 1} of ${selectedFiles.length} — ${Math.round(progress)}%`;

                                },

                                (error) => {

                                    reject(error);

                                },

                                () => {

                                    resolve();

                                }
                            );

                        }
                    );


                    /*
                    Get download URL
                    */

                    const downloadUrl =
                        await getDownloadURL(
                            uploadTask.snapshot.ref
                        );


                    uploadedFilesData.push({

                        name: file.name,

                        size: formatBytes(file.size),

                        url: downloadUrl

                    });

                }


                /*
                ----------------------------------------------
                SAVE METADATA TO FIRESTORE
                ----------------------------------------------
                */

                await setDoc(
                    doc(
                        db,
                        "shared_files",
                        secretKey
                    ),
                    {

                        secretKey: secretKey,

                        createdAt:
                            Timestamp.fromMillis(now),

                        expiresAt:
                            Timestamp.fromMillis(expiresAt),

                        files:
                            uploadedFilesData

                    }
                );


                /*
                ----------------------------------------------
                SUCCESS
                ----------------------------------------------
                */

                uploadLoading.classList.add("hidden");

                uploadSuccess.classList.remove("hidden");


                secretKeyDisplay.innerText =
                    secretKey;


                uploadTimeDisplay.innerText =
                    `Uploaded: ${new Date(now).toLocaleString()}`;

            }

            catch (error) {

                console.error(
                    "Firebase upload error:",
                    error
                );


                uploadLoading.classList.add("hidden");


                alert(
                    "Upload failed.\n\n" +
                    "Error: " +
                    error.message
                );


                resetUpload();

            }

        });


        /*
        ==========================================================
        COPY SECRET KEY
        ==========================================================
        */

        document
            .getElementById("copy-key-btn")
            .addEventListener("click", async () => {

                const key =
                    secretKeyDisplay.innerText;


                try {

                    await navigator.clipboard.writeText(key);

                    alert(
                        `Secret Key ${key} copied!`
                    );

                }

                catch (error) {

                    console.error(error);

                }

            });


        /*
        ==========================================================
        RESET UPLOAD
        ==========================================================
        */

        document
            .getElementById("reset-upload-btn")
            .addEventListener(
                "click",
                resetUpload
            );


        function resetUpload() {

            selectedFiles = [];

            fileInput.value = "";


            document
                .getElementById("file-count-display")
                .innerText =
                "Multiple files supported. 24h expiration.";


            uploadSuccess.classList.add("hidden");

            uploadLoading.classList.add("hidden");

            dropZone.classList.remove("hidden");

            uploadBtn.classList.add("hidden");

        }


        /*
        ==========================================================
        SEARCH FILE
        ==========================================================
        */

        document
            .getElementById("search-btn")
            .addEventListener("click", searchFiles);


        searchKey.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Enter") {

                    searchFiles();

                }

            }
        );


        async function searchFiles() {

            const keyInput =
                searchKey.value
                    .trim()
                    .toUpperCase();


            if (!keyInput) {

                return;

            }


            searchError.classList.add("hidden");

            downloadResults.classList.add("hidden");

            fileList.innerHTML = "";


            try {

                /*
                ----------------------------------------------
                GET FIRESTORE DOCUMENT
                ----------------------------------------------
                */

                const docRef =
                    doc(
                        db,
                        "shared_files",
                        keyInput
                    );


                const docSnap =
                    await getDoc(docRef);


                /*
                ----------------------------------------------
                DOCUMENT DOES NOT EXIST
                ----------------------------------------------
                */

                if (!docSnap.exists()) {

                    showSearchError(
                        "Invalid key. File does not exist."
                    );

                    return;

                }


                const data =
                    docSnap.data();


                /*
                ----------------------------------------------
                EXPIRATION CHECK
                ----------------------------------------------
                */

                if (
                    !data.expiresAt ||
                    typeof data.expiresAt.toMillis !== "function"
                ) {

                    showSearchError(
                        "Invalid file metadata."
                    );

                    return;

                }


                const now =
                    Date.now();


                if (
                    now >
                    data.expiresAt.toMillis()
                ) {

                    showSearchError(
                        "This file key has expired."
                    );

                    return;

                }


                /*
                ----------------------------------------------
                DISPLAY FILES
                ----------------------------------------------
                */

                if (
                    !Array.isArray(data.files) ||
                    data.files.length === 0
                ) {

                    showSearchError(
                        "No files were found."
                    );

                    return;

                }


                data.files.forEach(
                    (file) => {

                        createFileDownloadItem(
                            file
                        );

                    }
                );


                downloadResults.classList.remove(
                    "hidden"
                );

            }

            catch (error) {

                console.error(
                    "Firestore retrieval error:",
                    error
                );


                showSearchError(
                    "Error retrieving files. Check your Firebase configuration and rules."
                );

            }

        }


        /*
        ==========================================================
        SHOW SEARCH ERROR
        ==========================================================
        */

        function showSearchError(message) {

            searchError.innerText =
                message;

            searchError.classList.remove(
                "hidden"
            );

        }


        /*
        ==========================================================
        CREATE DOWNLOAD ITEM
        ==========================================================
        */

        function createFileDownloadItem(file) {

            const li =
                document.createElement("li");


            li.className =
                "flex justify-between items-center bg-gray-50 p-3 rounded border border-gray-200";


            const info =
                document.createElement("div");


            info.className =
                "flex flex-col truncate pr-4";


            const name =
                document.createElement("span");


            name.className =
                "font-semibold text-sm text-gray-800 truncate";


            name.textContent =
                file.name;


            const size =
                document.createElement("span");


            size.className =
                "text-xs text-gray-500";


            size.textContent =
                file.size || "";


            info.appendChild(name);

            info.appendChild(size);


            const download =
                document.createElement("a");


            download.href =
                file.url;


            download.target =
                "_blank";


            download.rel =
                "noopener noreferrer";


            download.textContent =
                "Download";


            download.className =
                "bg-green-600 hover:bg-green-700 text-white px-3 py-2 text-xs font-semibold rounded transition-colors";


            li.appendChild(info);

            li.appendChild(download);


            fileList.appendChild(li);

        }


        /*
        ==========================================================
        FORMAT FILE SIZE
        ==========================================================
        */

        function formatBytes(bytes) {

            if (bytes === 0) {

                return "0 Bytes";

            }


            const k = 1024;


            const sizes = [
                "Bytes",
                "KB",
                "MB",
                "GB",
                "TB"
            ];


            const i =
                Math.floor(
                    Math.log(bytes) /
                    Math.log(k)
                );


            return (
                parseFloat(
                    (
                        bytes /
                        Math.pow(k, i)
                    ).toFixed(2)
                ) +
                " " +
                sizes[i]
            );

        }


        /*
        ==========================================================
        FIREBASE READY
        ==========================================================
        */

        console.log(
            "FastFile Firebase initialized successfully."
        );

        console.log(
            "Project:",
            firebaseConfig.projectId
        );

        console.log(
            "Storage bucket:",
            firebaseConfig.storageBucket
        );

    </script>

</body>
</html>
